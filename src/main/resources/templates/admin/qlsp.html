<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}" class="active">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qlkh}">Quản lý tài khoản</a>
            <a th:href="@{/admin/staff}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
            <a th:href="@{/admin/qldt}">Thống kê</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý sản phẩm</h3>

            <!-- FORM -->
            <form method="post" class="card card-custom mb-4">
                <div class="card-body">

                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text"  name="name" class="form-control" placeholder="Tên sản phẩm">
                        </div>

                        <div class="col-md-3">
                            <input type="number" name="price" id="price" class="form-control" placeholder="Giá">
                        </div>

                        <div class="col-md-3">
                            <input type="number" name="quantity" id="quantity" class="form-control" placeholder="Số lượng">
                        </div>

                        <div class="col-md-3 d-flex align-items-center">
                            <input type="checkbox" id="status" name="status" checked> &nbsp; Hoạt động
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3">
                        <button class="btn btn-add" th:formaction="@{/admin/product/save}">Thêm</button>
                        <button class="btn btn-edit" onclick="editProduct()">Sửa</button>
                        <button class="btn btn-delete" onclick="deleteProduct()">Xóa</button>
                    </div>

                </div>
            </form>

            <div class="mb-3 d-flex justify-content-end">
                <div class="search-box">
                    <input type="text" id="searchInput"
                           placeholder="Tìm kiếm..."
                           onkeyup="searchTable()">

                    <i class="search-icon">🔍</i>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sp : ${listProduct}">
                            <td th:text="${sp.id}"></td>
                            <td th:text="${sp.name}"></td>
                            <td th:text="${sp.price}"></td>
                            <td th:text="${sp.quantity}"></td>
                            <td th:text="${sp.status? 'Hoạt động' : 'Ngừng bán'}"></td>
                            <td>
<!--                                <a th:href="@{/admin/qlkm/remove/{id}(id=${vou.id})}"-->
<!--                                   class="btn btn-danger"-->
<!--                                   onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">-->
<!--                                    Xóa-->
<!--                                </a>-->
<!--                                <a th:href="@{/admin/qlkm/detail/{id}(id=${vou.id})}"-->
<!--                                   class="btn btn-warning">-->
<!--                                    Chi tiết-->
<!--                                </a>-->
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let products = [];
    let currentId = 1;

    // ===== VALIDATE =====
    function validate(name, price, quantity) {
        if (name.trim() === "") return "Không được để trống tên!";
        if (price <= 0) return "Giá phải > 0!";
        if (quantity < 0) return "Số lượng không hợp lệ!";
        return "";
    }

    // ===== ADD =====
    function addProduct() {
        let name = document.getElementById("name").value;
        let price = parseFloat(document.getElementById("price").value);
        let quantity = parseInt(document.getElementById("quantity").value);
        let status = document.getElementById("status").checked;
        let error = document.getElementById("error");

        let check = validate(name, price, quantity);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        error.innerText = "";

        let product = {
            id: currentId++,
            product_name: name,
            product_price: price,
            quantity: quantity,
            product_status: status
        };

        products.push(product);
        render();
        clearForm();
    }

    // ===== DELETE (xóa sản phẩm cuối - giữ vibe cũ) =====
    function deleteProduct() {
        if (products.length === 0) return;
        products.pop();
        render();
    }

    // ===== EDIT (sửa sản phẩm cuối - giữ vibe cũ) =====
    function editProduct() {
        if (products.length === 0) return;

        let name = document.getElementById("name").value;
        let price = parseFloat(document.getElementById("price").value);
        let quantity = parseInt(document.getElementById("quantity").value);
        let status = document.getElementById("status").checked;
        let error = document.getElementById("error");

        let check = validate(name, price, quantity);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        let last = products[products.length - 1];

        last.product_name = name;
        last.product_price = price;
        last.quantity = quantity;
        last.product_status = status;

        render();
        clearForm();
    }



    // ===== SEARCH =====
    function searchTable() {
        let keyword = document.getElementById("searchInput").value.toLowerCase();
        let table = document.getElementById("productTable");
        table.innerHTML = "";

        let filtered = products.filter(p =>
            p.product_name.toLowerCase().includes(keyword)
        );

        filtered.forEach(p => {
            table.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.product_name}</td>
                    <td>${p.product_price}</td>
                    <td>${p.quantity}</td>
                    <td>${p.product_status ? "Hoạt động" : "Ngừng"}</td>
                </tr>
            `;
        });
    }

    // ===== CLEAR FORM =====
    function clearForm() {
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("quantity").value = "";
        document.getElementById("status").checked = true;
    }
</script>

</body>
</html>
