<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qlkh}" class="active">Quản lý khách hàng</a>
            <a th:href="@{/admin/qlnv}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý khách hàng</h3>

            <!-- FORM -->
            <div class="card card-custom mb-4">
                <div class="card-body">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" id="name" class="form-control" placeholder="Tên khách hàng">
                        </div>

                        <div class="col-md-4">
                            <input type="email" id="email" class="form-control" placeholder="Email">
                        </div>

                        <div class="col-md-4">
                            <input type="text" id="phone" class="form-control" placeholder="SĐT">
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3">
                        <button class="btn btn-add" onclick="addCustomer()">Thêm</button>
                        <button class="btn btn-edit" onclick="editCustomer()">Sửa</button>
                        <button class="btn btn-delete" onclick="deleteCustomer()">Xóa</button>
                    </div>

                </div>
            </div>

            <div class="mb-3 d-flex justify-content-end">
                <input type="text" id="searchInput"
                       class="form-control w-25"
                       placeholder="Tìm kiếm..."
                       onkeyup="searchTable()">
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                        </tr>
                        </thead>
                        <tbody id="customerTable"></tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let customers = [];

    function validateCustomer(name, email, phone) {
        if (name === "") return "Không được để trống tên!";
        if (!email.includes("@")) return "Email không hợp lệ!";
        if (phone.length < 9) return "SĐT không hợp lệ!";
        return "";
    }

    function addCustomer() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let phone = document.getElementById("phone").value;

        let error = document.getElementById("error");
        let check = validateCustomer(name, email, phone);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        error.innerText = "";

        customers.push({ name, email, phone });
        render();
    }

    function deleteCustomer() {
        customers.pop();
        render();
    }

    function editCustomer() {
        if (customers.length === 0) return;

        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let phone = document.getElementById("phone").value;

        let check = validateCustomer(name, email, phone);

        if (check !== "") {
            document.getElementById("error").innerText = check;
            return;
        }

        customers[customers.length - 1] = { name, email, phone };
        render();
    }

    function render() {
        let table = document.getElementById("customerTable");
        table.innerHTML = "";

        customers.forEach(c => {
            table.innerHTML += `
            <tr>
                <td>${c.name}</td>
                <td>${c.email}</td>
                <td>${c.phone}</td>
            </tr>
        `;
        });
    }
</script>

</body>
</html>
