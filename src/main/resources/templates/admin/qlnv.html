<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý nhân viên</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
      <h4>ADMIN</h4>

      <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
      <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
      <a th:href="@{/admin/qltk}">Quản lý tài khoản</a>
      <a th:href="@{/admin/staff}" class="active">Quản lý nhân viên</a>
      <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
      <a th:href="@{/admin/qldt}">Thống kê</a>
    </div>

    <!-- CONTENT -->
    <div class="col-md-10 content">

      <h3 class="title">Quản lý nhân viên</h3>

      <!-- FORM -->
      <form  method="post" action="/admin/staff/save" th:object="${staff}" class="card card-custom mb-4">
        <div class="card-body">
            <div class="col-md-3">
              <input type="hidden" th:field="*{id}">
            </div>

          <div class="row g-3">
            <div class="col-md-3">
              <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Tên nhân viên">
            </div>


            <div class="col-md-3">
              <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="SĐT">
            </div>

            <div class="col-md-3">
              <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="Địa chỉ">
            </div>

            <div class="col-md-3">
              <input type="number" id="age" th:field="*{age}" class="form-control" placeholder="Tuổi">
            </div>

            <div class="col-md-3">
              <label class="form-label d-block">Giới tính</label>

              <div class="form-check form-check-inline">
                <input type="radio" th:field="*{gender}" th:value="true" class="form-check-input" id="genderMale">
                <label class="form-check-label" for="genderMale">Nam</label>
              </div>

              <div class="form-check form-check-inline">
                <input type="radio" th:field="*{gender}" th:value="false" class="form-check-input" id="genderFemale">
                <label class="form-check-label" for="genderFemale">Nữ</label>
              </div>
            </div>
          </div>

          <p id="error" class="text-danger mt-2"></p>

          <!-- BUTTON -->
          <div class="mt-3">
            <button class="btn btn-add" type="submit">Thêm</button>
            <button class="btn btn-edit" th:href="@{/admin/staff/edit}">Sửa</button>
          </div>

        </div>
      </form>

      <!-- TABLE -->
      <div class="card card-custom">
        <div class="card-body">

          <table class="table table-hover text-center">
            <thead>
            <tr>
              <th>Tên</th>
              <th>Địa chỉ</th>
              <th>SĐT</th>
              <th>Giới tính</th>
              <th>Tuổi</th>
              <th>Action</th>
            </tr>
            </thead>
            <tr th:each="nv : ${listStaff}">
              <td th:text="${nv.name}"></td>
              <td th:text="${nv.address}"></td>
              <td th:text="${nv.phone}"></td>
              <td th:text="${nv.gender? 'Nam' : 'Nữ'}"></td>
              <td th:text="${nv.age}"></td>
              <td>
                <a th:href="@{/admin/staff/delete/{id}(id=${nv.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">
                  Xóa
                </a>
                <a th:href="@{/admin/staff/detail/{id}(id=${nv.id})}"
                   class="btn btn-warning">
                  Chi tiết
                </a>
              </td>
            </tr>
          </table>
        </div>
      </div>

    </div>

  </div>
</div>

<script>

  function validateEmployee(name, email, phone, role) {
    if (name === "") return "Không được để trống tên!";
    if (!email.includes("@")) return "Email không hợp lệ!";
    if (phone.length < 9) return "SĐT không hợp lệ!";
    if (role === "") return "Nhập chức vụ!";
    return "";
  }

</script>
</body>
</html>
