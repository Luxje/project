<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý nhân viên</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
      <h4>ADMIN</h4>

      <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
      <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
      <a th:href="@{/admin/qltk}">Quản lý khách hàng</a>
      <a th:href="@{/admin/qlnv}" class="active">Quản lý nhân viên</a>
      <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
      <a th:href="@{/admin/qldt}">Thống kê</a>
    </div>

    <!-- CONTENT -->
    <div class="col-md-10 content">

      <h3 class="title">Quản lý nhân viên</h3>

      <!-- FORM -->
      <div class="card card-custom mb-4">
        <div class="card-body">

          <div class="row g-3">
            <div class="col-md-3">
              <input type="text" id="name" class="form-control" placeholder="Tên nhân viên">
            </div>

            <div class="col-md-3">
              <input type="email" id="email" class="form-control" placeholder="Email">
            </div>

            <div class="col-md-3">
              <input type="text" id="phone" class="form-control" placeholder="SĐT">
            </div>

            <div class="col-md-3">
              <input type="text" id="role" class="form-control" placeholder="Chức vụ">
            </div>
          </div>

          <p id="error" class="text-danger mt-2"></p>

          <!-- BUTTON -->
          <div class="mt-3">
            <button class="btn btn-add" onclick="addEmployee()">Thêm</button>
            <button class="btn btn-edit" onclick="editEmployee()">Sửa</button>
            <button class="btn btn-delete" onclick="deleteEmployee()">Xóa</button>
          </div>

        </div>
      </div>

      <!-- TABLE -->
      <div class="card card-custom">
        <div class="card-body">

          <table class="table table-hover text-center">
            <thead>
            <tr>
              <th>Tên</th>
              <th>Email</th>
              <th>SĐT</th>
              <th>Chức vụ</th>
            </tr>
            </thead>
            <tbody id="employeeTable"></tbody>
          </table>

        </div>
      </div>

    </div>

  </div>
</div>

<script>
  let employees = [];

  function validateEmployee(name, email, phone, role) {
    if (name === "") return "Không được để trống tên!";
    if (!email.includes("@")) return "Email không hợp lệ!";
    if (phone.length < 9) return "SĐT không hợp lệ!";
    if (role === "") return "Nhập chức vụ!";
    return "";
  }

  function addEmployee() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let role = document.getElementById("role").value;

    let error = document.getElementById("error");
    let check = validateEmployee(name, email, phone, role);

    if (check !== "") {
      error.innerText = check;
      return;
    }

    error.innerText = "";

    employees.push({ name, email, phone, role });
    render();
  }

  function deleteEmployee() {
    employees.pop();
    render();
  }

  function editEmployee() {
    if (employees.length === 0) return;

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let role = document.getElementById("role").value;

    let check = validateEmployee(name, email, phone, role);

    if (check !== "") {
      document.getElementById("error").innerText = check;
      return;
    }

    employees[employees.length - 1] = { name, email, phone, role };
    render();
  }

  function render() {
    let table = document.getElementById("employeeTable");
    table.innerHTML = "";

    employees.forEach(e => {
      table.innerHTML += `
            <tr>
                <td>${e.name}</td>
                <td>${e.email}</td>
                <td>${e.phone}</td>
                <td>${e.role}</td>
            </tr>
        `;
    });
  }
</script>

</body>
</html>
