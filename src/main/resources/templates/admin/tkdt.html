<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thống kê doanh thu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
      <h4>ADMIN</h4>

      <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
      <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
      <a th:href="@{/admin/qltk}">Quản lý tài khoản</a>
      <a th:href="@{/admin/qlnv}">Quản lý nhân viên</a>
      <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
      <a th:href="@{/admin/tkdt}" class="active">Thống kê</a>
    </div>

    <!-- CONTENT -->
    <div class="col-md-10 content">

      <h3 class="title">Thống kê doanh thu</h3>

      <!-- ===== CARD ===== -->
      <div class="row mb-4">

        <div class="col-md-2">
          <div class="card card-custom text-center p-3">
            <p>Tổng doanh thu</p>
            <h5 th:text="${totalRevenue}"></h5>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card card-custom text-center p-3">
            <p>Hôm nay</p>
            <h5 th:text="${todayRevenue}"></h5>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card card-custom text-center p-3">
            <p>Tổng đơn</p>
            <h5 th:text="${totalOrders}"></h5>
          </div>
        </div>
      </div>

      <!-- ===== FILTER ===== -->
      <form method="post" th:action="@{/admin/qldt/sort}" class="card card-custom mb-4">
        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-3">
              <input type="date" name="startDate" class="form-control">
            </div>

            <div class="col-md-3">
              <input type="date" name="startDate" class="form-control">
            </div>


            <div class="col-md-3">
              <button class="btn btn-add w-100">Lọc</button>
            </div>

          </div>
        </div>
      </form>


      <!-- ===== TABLE DOANH THU ===== -->
      <div class="card card-custom mb-4">
        <div class="card-body">

          <h5 class="mb-3">Chi tiết doanh thu</h5>

          <table class="table table-hover text-center">
            <thead>
            <tr>
              <th>Thời gian</th>
              <th>Doanh thu</th>
              <th>Số đơn</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${revenueList}">
              <td th:text="${item.date}"></td>
              <td th:text="${item.price}"></td>
              <td th:text="${item.customerid}"></td>
            </tr>
            </tbody>

          </table>

        </div>
      </div>

    </div>

  </div>
</div>

<script>
  const labels = /*[[${chartLabels}]]*/ [];
  const data = /*[[${chartData}]]*/ [];

  new Chart(document.getElementById("revenueChart"), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Doanh thu',
        data: data,
        tension: 0.4
      }]
    }
  });
</script>

</body>
</html>
