<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý hóa đơn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qltk}">Quản lý tài khoản</a>
            <a th:href="@{/admin/staff}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}" class="active">Quản lý hóa đơn</a>
            <a th:href="@{/admin/qldt}">Thống kê</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý hóa đơn</h3>

            <!-- FORM -->
            <div class="card card-custom mb-4">
                <div class="card-body">

                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" id="name" class="form-control" placeholder="Tên hóa đơn">
                        </div>

                        <div class="col-md-3">
                            <input type="number" id="total" class="form-control" placeholder="Tổng tiền">
                        </div>

                        <div class="col-md-2">
                            <input type="number" id="voucher" class="form-control" placeholder="Voucher ID">
                        </div>

                        <div class="col-md-2">
                            <input type="number" id="staff" class="form-control" placeholder="Staff ID">
                        </div>

                        <div class="col-md-2">
                            <input type="number" id="customer" class="form-control" placeholder="Customer ID">
                        </div>

                        <div class="col-md-3">
                            <input type="date" id="date" class="form-control">
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3">
                        <button class="btn btn-add" onclick="addOrder()">Thêm</button>
                        <button class="btn btn-edit" onclick="editOrder()">Sửa</button>
                        <button class="btn btn-delete" onclick="deleteOrder()">Xóa</button>
                    </div>

                </div>
            </div>

            <div class="mb-3 d-flex justify-content-end">
                <div class="search-box">
                    <input type="text" id="searchInput"
                           placeholder="Tìm kiếm..."
                           onkeyup="searchTable()">

                    <i class="search-icon">🔍</i>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Tổng tiền</th>
                            <th>Voucher</th>
                            <th>Staff</th>
                            <th>Customer</th>
                            <th>Ngày</th>
                        </tr>
                        </thead>
                        <tbody id="orderTable"></tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let invoices = [];
    let currentId = 1;

    // ===== VALIDATE =====
    function validateInvoice(name, total, staff, customer) {
        if (name.trim() === "") return "Không được để trống tên!";
        if (total <= 0) return "Tổng tiền phải > 0!";
        if (staff === "" || customer === "") return "Thiếu staff hoặc customer!";
        return "";
    }

    // ===== ADD =====
    function addOrder() {
        let name = document.getElementById("name").value;
        let total = parseFloat(document.getElementById("total").value);
        let voucher = document.getElementById("voucher").value;
        let staff = document.getElementById("staff").value;
        let customer = document.getElementById("customer").value;
        let date = document.getElementById("date").value;
        let error = document.getElementById("error");

        let check = validateInvoice(name, total, staff, customer);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        error.innerText = "";

        let invoice = {
            id: currentId++,
            invoice_name: name,
            total_price: total,
            voucher_id: voucher || null,
            staff_id: staff,
            customer_id: customer,
            invoice_date: date || new Date().toISOString().split("T")[0]
        };

        invoices.push(invoice);
        render();
        clearForm();
    }

    // ===== DELETE =====
    function deleteOrder() {
        if (invoices.length === 0) return;
        invoices.pop();
        render();
    }

    // ===== EDIT =====
    function editOrder() {
        if (invoices.length === 0) return;

        let name = document.getElementById("name").value;
        let total = parseFloat(document.getElementById("total").value);
        let voucher = document.getElementById("voucher").value;
        let staff = document.getElementById("staff").value;
        let customer = document.getElementById("customer").value;
        let date = document.getElementById("date").value;
        let error = document.getElementById("error");

        let check = validateInvoice(name, total, staff, customer);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        let last = invoices[invoices.length - 1];

        last.invoice_name = name;
        last.total_price = total;
        last.voucher_id = voucher || null;
        last.staff_id = staff;
        last.customer_id = customer;
        last.invoice_date = date;

        render();
        clearForm();
    }

    // ===== RENDER =====
    function render() {
        let table = document.getElementById("orderTable");
        table.innerHTML = "";

        invoices.forEach(i => {
            table.innerHTML += `
                <tr>
                    <td>${i.id}</td>
                    <td>${i.invoice_name}</td>
                    <td>${i.total_price}</td>
                    <td>${i.voucher_id ?? ""}</td>
                    <td>${i.staff_id}</td>
                    <td>${i.customer_id}</td>
                    <td>${i.invoice_date}</td>
                </tr>
            `;
        });
    }

    // ===== SEARCH =====
    function searchTable() {
        let keyword = document.getElementById("searchInput").value.toLowerCase();
        let table = document.getElementById("orderTable");
        table.innerHTML = "";

        let filtered = invoices.filter(i =>
            i.invoice_name.toLowerCase().includes(keyword)
        );

        filtered.forEach(i => {
            table.innerHTML += `
                <tr>
                    <td>${i.id}</td>
                    <td>${i.invoice_name}</td>
                    <td>${i.total_price}</td>
                    <td>${i.voucher_id ?? ""}</td>
                    <td>${i.staff_id}</td>
                    <td>${i.customer_id}</td>
                    <td>${i.invoice_date}</td>
                </tr>
            `;
        });
    }

    // ===== CLEAR FORM =====
    function clearForm() {
        document.getElementById("name").value = "";
        document.getElementById("total").value = "";
        document.getElementById("voucher").value = "";
        document.getElementById("staff").value = "";
        document.getElementById("customer").value = "";
        document.getElementById("date").value = "";
    }
</script>

</body>
</html>
