<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý khách hàng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
      <h4>ADMIN</h4>

      <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
      <a th:href="@{/admin/qlkm}">Quản lý khuyến mãi</a>
      <a th:href="@{/admin/qlkh}" class="active">Quản lý khách hàng</a>
      <a th:href="@{/admin/qlnv}">Quản lý nhân viên</a>
      <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
    </div>

    <!-- CONTENT -->
    <div class="col-md-10 content">

      <h3 class="title">Quản lý khách hàng</h3>

      <!-- FORM -->
      <form method="post">
      <div class="card card-custom mb-4">
        <div class="card-body">

          <div class="row g-3">
            <div class="col-md-3">
              <input type="text" id="name" class="form-control" name="name" placeholder="Tên">
            </div>

            <div class="col-md-2">
              <select id="role" name="role" class="form-control">
                <option value="">-- Vai trò --</option>
                <option value="ADMIN">ADMIN</option>
                <option value="STAFF">STAFF</option>
                <option value="CUSTOMER">CUSTOMER</option>
              </select>
            </div>

            <div class="col-md-2">
              <input type="text" id="phone" class="form-control" name="phone" placeholder="SĐT">
            </div>

            <div class="col-md-3">
              <input type="text" id="address" class="form-control" name="address" placeholder="Địa chỉ">
            </div>

            <div class="col-md-1">
              <input type="number" id="age" class="form-control" name="age" placeholder="Tuổi">
            </div>

            <div class="col-md-1">
              <select id="gender" class="form-control" name="gender">
                <option value="">GT</option>
                <option value="1">Nam</option>
                <option value="0">Nữ</option>
              </select>
            </div>

            <div class="col-md-3">
              <input type="password" id="password" class="form-control" name="password" placeholder="Mật khẩu">
            </div>
          </div>

          <p id="error" class="text-danger mt-2"></p>

          <!-- BUTTON -->
          <div class="mt-3">
            <button class="btn btn-add" th:formaction="@{/admin/qltk/add}" type="submit">Thêm</button>
            <button class="btn btn-edit" >Sửa</button>
            <button class="btn btn-delete" >Xóa</button>
          </div>

        </div>
      </div>
      </form>
      <div class="mb-3 d-flex justify-content-end">
        <input type="text" id="searchInput"
               class="form-control w-25"
               placeholder="Tìm kiếm..."
               onkeyup="searchTable()">
      </div>

      <!-- TABLE -->
      <div class="card card-custom">
        <div class="card-body">

          <table class="table table-hover text-center">
            <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th>Role</th>
              <th>SĐT</th>
              <th>Địa chỉ</th>
              <th>Tuổi</th>
              <th>Giới tính</th>
            </tr>
            </thead>
            <tbody id="customerTable">
            <tr th:each="tk : ${lstTK}">
              <td th:text="${tk.id}"></td>
              <td th:text="${tk.name}"></td>
              <td th:text="${tk.role}"></td>
              <td th:text="${tk.phone}"></td>
              <td th:text="${tk.address}"></td>
              <td th:text="${tk.age}"></td>
              <td th:text="${tk.gender? 'Nam' : 'Nu'}"></td>
            </tr>
            </tbody>
          </table>

        </div>
      </div>

    </div>

  </div>
</div>

<script>

  // ===== VALIDATE =====
  function validateUser(name, role, phone, age, password) {
    if (name.trim() === "") return "Không được để trống tên!";
    if (role === "") return "Chọn vai trò!";
    if (phone.length < 9) return "SĐT không hợp lệ!";
    if (age < 0) return "Tuổi không hợp lệ!";
    if (password.trim() === "") return "Nhập mật khẩu!";
    return "";
  }

  // ===== CLEAR =====
  function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("role").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";
    document.getElementById("age").value = "";
    document.getElementById("gender").value = "";
    document.getElementById("password").value = "";
  }
</script>

</body>
</html>
