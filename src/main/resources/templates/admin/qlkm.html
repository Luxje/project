<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khuyến mãi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}" class="active">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qlkh}">Quản lý khách hàng</a>
            <a th:href="@{/admin/qlnv}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý khuyến mãi</h3>

            <!-- FORM -->
            <div class="card card-custom mb-4">
                <div class="card-body">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" id="promoName" class="form-control" placeholder="Tên khuyến mãi">
                        </div>

                        <div class="col-md-3">
                            <input type="number" id="discount" class="form-control" placeholder="% giảm">
                        </div>

                        <div class="col-md-3">
                            <input type="date" id="startDate" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <input type="date" id="endDate" class="form-control">
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3">
                        <button class="btn btn-add" onclick="addPromo()">Thêm</button>
                        <button class="btn btn-edit" onclick="editPromo()">Sửa</button>
                        <button class="btn btn-delete" onclick="deletePromo()">Xóa</button>
                    </div>

                </div>
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>Tên</th>
                            <th>% Giảm</th>
                            <th>Bắt đầu</th>
                            <th>Kết thúc</th>
                        </tr>
                        </thead>
                        <tbody id="promoTable"></tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let promotions = [];

    function validatePromo(name, discount, start, end) {
        if (name === "") return "Không được để trống tên!";
        if (discount <= 0 || discount > 100) return "Giảm từ 1 - 100%!";
        if (start === "" || end === "") return "Chọn ngày!";
        if (start > end) return "Ngày bắt đầu phải trước ngày kết thúc!";
        return "";
    }

    function addPromo() {
        let name = document.getElementById("promoName").value;
        let discount = document.getElementById("discount").value;
        let start = document.getElementById("startDate").value;
        let end = document.getElementById("endDate").value;

        let error = document.getElementById("error");
        let check = validatePromo(name, discount, start, end);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        error.innerText = "";

        promotions.push({ name, discount, start, end });
        render();
    }

    function deletePromo() {
        promotions.pop();
        render();
    }

    function editPromo() {
        if (promotions.length === 0) return;

        let name = document.getElementById("promoName").value;
        let discount = document.getElementById("discount").value;
        let start = document.getElementById("startDate").value;
        let end = document.getElementById("endDate").value;

        let check = validatePromo(name, discount, start, end);

        if (check !== "") {
            document.getElementById("error").innerText = check;
            return;
        }

        promotions[promotions.length - 1] = { name, discount, start, end };
        render();
    }

    function render() {
        let table = document.getElementById("promoTable");
        table.innerHTML = "";

        promotions.forEach(p => {
            table.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.discount}%</td>
                <td>${p.start}</td>
                <td>${p.end}</td>
            </tr>
        `;
        });
    }
</script>

</body>
</html>
