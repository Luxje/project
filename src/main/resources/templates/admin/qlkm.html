<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khuyến mãi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}" class="active">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qlkh}">Quản lý tài khoản</a>
            <a th:href="@{/admin/qlnv}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
            <a th:href="@{/admin/tkdt}">Thống kê</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý khuyến mãi</h3>

            <!-- FORM -->
            <div class="card card-custom mb-4">
                <div class="card-body">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" id="promoName" class="form-control" placeholder="Tên khuyến mãi">
                        </div>

                        <div class="col-md-3">
                            <input type="number" id="discount" class="form-control" placeholder="Giá trị giảm (VND)">
                        </div>

                        <div class="col-md-3">
                            <input type="date" id="startDate" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <input type="date" id="endDate" class="form-control">
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3">
                        <button class="btn btn-add" onclick="addPromo()">Thêm</button>
                        <button class="btn btn-edit" onclick="editPromo()">Sửa</button>
                        <button class="btn btn-delete" onclick="deletePromo()">Xóa</button>
                    </div>

                </div>
            </div>

            <div class="mb-3 d-flex justify-content-end">
                <div class="search-box">
                    <input type="text" id="searchInput"
                           placeholder="Tìm kiếm..."
                           onkeyup="searchTable()">

                    <i class="search-icon">🔍</i>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Giá trị</th>
                            <th>Bắt đầu</th>
                            <th>Kết thúc</th>
                        </tr>
                        </thead>
                        <tbody id="promoTable"></tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let vouchers = [];
    let currentId = 1;

    // ===== VALIDATE =====
    function validateVoucher(name, value, start, end) {
        if (name.trim() === "") return "Không được để trống tên!";
        if (value < 0) return "Giá trị phải >= 0!";
        if (start === "" || end === "") return "Chọn ngày!";
        if (start > end) return "Ngày bắt đầu phải trước ngày kết thúc!";
        return "";
    }

    // ===== ADD =====
    function addPromo() {
        let name = document.getElementById("promoName").value;
        let value = parseFloat(document.getElementById("discount").value);
        let start = document.getElementById("startDate").value;
        let end = document.getElementById("endDate").value;
        let error = document.getElementById("error");

        let check = validateVoucher(name, value, start, end);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        error.innerText = "";

        let voucher = {
            id: currentId++,
            voucher_name: name,
            voucher_value: value,
            voucher_start: start,
            voucher_end: end
        };

        vouchers.push(voucher);
        render();
        clearForm();
    }

    // ===== DELETE =====
    function deletePromo() {
        if (vouchers.length === 0) return;
        vouchers.pop();
        render();
    }

    // ===== EDIT =====
    function editPromo() {
        if (vouchers.length === 0) return;

        let name = document.getElementById("promoName").value;
        let value = parseFloat(document.getElementById("discount").value);
        let start = document.getElementById("startDate").value;
        let end = document.getElementById("endDate").value;
        let error = document.getElementById("error");

        let check = validateVoucher(name, value, start, end);

        if (check !== "") {
            error.innerText = check;
            return;
        }

        let last = vouchers[vouchers.length - 1];

        last.voucher_name = name;
        last.voucher_value = value;
        last.voucher_start = start;
        last.voucher_end = end;

        render();
        clearForm();
    }

    // ===== RENDER =====
    function render() {
        let table = document.getElementById("promoTable");
        table.innerHTML = "";

        vouchers.forEach(v => {
            table.innerHTML += `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.voucher_name}</td>
                    <td>${v.voucher_value}</td>
                    <td>${v.voucher_start}</td>
                    <td>${v.voucher_end}</td>
                </tr>
            `;
        });
    }

    // ===== SEARCH =====
    function searchTable() {
        let keyword = document.getElementById("searchInput").value.toLowerCase();
        let table = document.getElementById("promoTable");
        table.innerHTML = "";

        let filtered = vouchers.filter(v =>
            v.voucher_name.toLowerCase().includes(keyword)
        );

        filtered.forEach(v => {
            table.innerHTML += `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.voucher_name}</td>
                    <td>${v.voucher_value}</td>
                    <td>${v.voucher_start}</td>
                    <td>${v.voucher_end}</td>
                </tr>
            `;
        });
    }

    // ===== CLEAR FORM =====
    function clearForm() {
        document.getElementById("promoName").value = "";
        document.getElementById("discount").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
    }
</script>

</body>
</html>
