<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khuyến mãi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>ADMIN</h4>

            <a th:href="@{/admin/qlsp}">Quản lý sản phẩm</a>
            <a th:href="@{/admin/qlkm}" class="active">Quản lý khuyến mãi</a>
            <a th:href="@{/admin/qltk}">Quản lý tài khoản</a>
            <a th:href="@{/admin/staff}">Quản lý nhân viên</a>
            <a th:href="@{/admin/qlhd}">Quản lý hóa đơn</a>
            <a th:href="@{/admin/qldt}">Thống kê</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Quản lý khuyến mãi</h3>

            <!-- FORM -->
            <form method="post" th:object="${voucher}" class="card card-custom mb-4">
                <div class="card-body">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Tên khuyến mãi">
                        </div>

                        <div class="col-md-3">
                            <input type="number" th:field="*{value}" class="form-control" placeholder="Giá trị giảm">
                        </div>

                        <div class="col-md-3">
                            <input type="date" th:field="*{startdate}" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <input type="date" th:field="*{enddate}" class="form-control">
                        </div>
                    </div>

                    <p id="error" class="text-danger mt-2"></p>

                    <!-- BUTTON -->
                    <div class="mt-3 d-flex justify-content-end gap-2">
                        <button type="submit" th:formaction="@{/admin/qlkm/add}" class="btn btn-success">Thêm</button>
                        <button type="submit" th:formaction="@{/admin/qlkm/edit}" class="btn btn-primary">Sửa</button>
                    </div>

                </div>
            </form>

            <div class="mb-3 d-flex justify-content-end">
                <div class="search-box">
                    <input type="text" id="searchInput"
                           placeholder="Tìm kiếm..."
                           onkeyup="searchTable()">

                    <i class="search-icon">🔍</i>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card card-custom">
                <div class="card-body">

                    <table class="table table-hover text-center">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Giá trị</th>
                            <th>Bắt đầu</th>
                            <th>Kết thúc</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vou : ${lstVoucher}">
                            <td th:text="${vou.id}"></td>
                            <td th:text="${vou.name}"></td>
                            <td th:text="${vou.value}"></td>
                            <td th:text="${vou.startdate}"></td>
                            <td th:text="${vou.enddate}"></td>
                            <td>
                                <a th:href="@{/admin/qlkm/remove/{id}(id=${vou.id})}"
                                   class="btn btn-danger"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">
                                    Xóa
                                </a>
                                <a th:href="@{/admin/qlkm/detail/{id}(id=${vou.id})}"
                                   class="btn btn-warning">
                                    Chi tiết
                                </a>
                            </td>

                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </div>

    </div>
</div>

<script>
    let vouchers = [];
    let currentId = 1;

    // ===== VALIDATE =====
    function validateVoucher(name, value, start, end) {
        if (name.trim() === "") return "Không được để trống tên!";
        if (value < 0) return "Giá trị phải >= 0!";
        if (start === "" || end === "") return "Chọn ngày!";
        if (start > end) return "Ngày bắt đầu phải trước ngày kết thúc!";
        return "";
    }



    // ===== RENDER =====
    function render() {
        let table = document.getElementById("promoTable");
        table.innerHTML = "";

        vouchers.forEach(v => {
            table.innerHTML += `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.voucher_name}</td>
                    <td>${v.voucher_value}</td>
                    <td>${v.voucher_start}</td>
                    <td>${v.voucher_end}</td>
                </tr>
            `;
        });
    }

    // ===== SEARCH =====
    function searchTable() {
        let keyword = document.getElementById("searchInput").value.toLowerCase();
        let table = document.getElementById("promoTable");
        table.innerHTML = "";

        let filtered = vouchers.filter(v =>
            v.voucher_name.toLowerCase().includes(keyword)
        );

        filtered.forEach(v => {
            table.innerHTML += `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.voucher_name}</td>
                    <td>${v.voucher_value}</td>
                    <td>${v.voucher_start}</td>
                    <td>${v.voucher_end}</td>
                </tr>
            `;
        });
    }

    // ===== CLEAR FORM =====
    function clearForm() {
        document.getElementById("promoName").value = "";
        document.getElementById("discount").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
    }
</script>

</body>
</html>
