<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Teddy Shop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e0, #ffe9c7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: white;
            padding: 30px 40px;
            border-radius: 25px;
            width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            margin: 20px;
        }

        .bear {
            font-size: 50px;
            margin-bottom: 5px;
            display: block;
        }

        h2 {
            margin: 0 0 10px 0;
            color: #ff7b9c;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box; /* Quan trọng để padding không làm tràn input */
            background-color: #fafafa;
        }

        input:focus {
            border-color: #ff7b9c;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(255, 123, 156, 0.2);
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #ff7b9c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #ff5f87;
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #ff7b9c;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Hiển thị lỗi nếu có (Thymeleaf) */
        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="bear">🧸</div>
    <h2>Tạo tài khoản</h2>
    <p>Gia nhập gia đình Teddy Shop ngay!</p>

    <form th:action="@{/user/register}" method="post">

        <div class="form-group">
            <input type="text" name="username" placeholder="Họ và tên" required>
        </div>

        <div class="form-group">
            <input type="text" name="phone" placeholder="Số điện thoại" required>
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Mật khẩu" required>
        </div>

        <div class="form-group">
            <input type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu" required>
        </div>

        <button type="submit" class="btn-register">Đăng ký ngay</button>
    </form>

    <div class="login-link">
        Đã có tài khoản? <a th:href="@{/user/login}">Đăng nhập</a>
    </div>
</div>

</body>
</html>
