<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Teddy Voucher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #d46a92;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home {
            background: #f7c8d8;
            color: #5a2a3a;
        }

        .btn-submit {
            background: #ff8fb1;
            color: white;
        }

        form {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #f0c2d0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border-bottom: 1px solid #f3d6df;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #ffe3ec;
            color: #6b2c3b;
        }

        .action-btn {
            background: #ffd1dc;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="top-bar">
        <a class="btn btn-home" href="/admin/page">🏠 Home</a>
        <h1>🧸 Teddy Voucher Manager</h1>
        <div></div>
    </div>

    <form method="post" action="/admin/savevoucher" th:object="${voucher}">
        <input type="hidden" th:field="*{id}">
        <input type="text" th:field="*{name}" placeholder="Voucher name">
        <input type="date" th:field="*{startdate}">
        <input type="date" th:field="*{enddate}">
        <input type="number" th:field="*{value}" placeholder="Value">
        <button class="btn btn-submit">Submit</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>id</th>
            <th>voucher name</th>
            <th>start date</th>
            <th>end date</th>
            <th>value</th>
            <th>action</th>
        </tr>
        </thead>

        <tr th:each="l : ${list}">
            <td th:text="${l.id}"></td>
            <td th:text="${l.name}"></td>
            <td th:text="${l.startdate}"></td>
            <td th:text="${l.enddate}"></td>
            <td th:text="${l.value}"></td>

            <td>
                <a th:href="@{/admin/voucherdelete(id=${l.id})}">
                    <button class="action-btn">delete</button>
                </a>
                <a th:href="@{/admin/voucherupdate(id=${l.id})}">
                    <button class="action-btn">update</button>
                </a>
            </td>
        </tr>
    </table>

</div>
</body>
</html>
