<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bán hàng tại quầy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bhtq.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <a th:href="@{/admin/bhtq}" class="active">Bán hàng</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <h3 class="title">Bán hàng tại quầy</h3>

            <div class="row">

                <!-- ===== SẢN PHẨM ===== -->
                <div class="col-md-7">

                    <div class="d-flex gap-2 mb-3">
                        <input type="text" id="searchProduct"
                               class="form-control"
                               placeholder="Tìm sản phẩm...">

                        <button class="btn btn-search" onclick="searchProduct()">
                            Tìm
                        </button>
                    </div>

                    <div class="card card-custom">
                        <div class="card-body">

                            <div class="row" id="productList">

                                <div class="col-md-4 mb-3" th:each="p : ${products}">
                                    <div class="product-card p-3 text-center"
                                         onclick="addToCart('${p.name}', ${p.price})">

                                        <h6 th:text="${p.name}"></h6>
                                        <p th:text="${p.price} + ' đ'"></p>

                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>

                </div>

                <!-- ===== GIỎ HÀNG ===== -->
                <div class="col-md-5">

                    <div class="card card-custom">
                        <div class="card-body">

                            <h5 class="mb-3">Giỏ hàng</h5>

                            <table class="table text-center">
                                <thead>
                                <tr>
                                    <th>Tên</th>
                                    <th>SL</th>
                                    <th>Giá</th>
                                    <th></th>
                                </tr>
                                </thead>

                                <tbody id="cartTable"></tbody>
                            </table>

                            <hr>

                            <h5>Tổng: <span id="total">0</span> đ</h5>

                            <button class="btn btn-add w-100 mt-3">
                                Thanh toán
                            </button>

                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
