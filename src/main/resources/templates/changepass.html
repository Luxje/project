<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/changepass.css}">
</head>

<body style="margin:0; height:100vh; overflow:hidden;">

<!-- BACKGROUND SLIDESHOW -->
<div id="bg1" style="
    position: fixed;
    inset: 0;
    background: url('/images/banner1.jpg') no-repeat center center/cover;
    filter: blur(6px);
    z-index: -2;
    opacity: 1;
    transition: opacity 1s ease;
"></div>

<div id="bg2" style="
    position: fixed;
    inset: 0;
    background: url('/images/banner2.jpg') no-repeat center center/cover;
    filter: blur(6px);
    z-index: -2;
    opacity: 0;
    transition: opacity 1s ease;
"></div>

<!-- LỚP PHỦ MÀU -->
<div style="
    position: fixed;
    inset: 0;
    background: rgba(245, 230, 211, 0.6);
    z-index: -1;
"></div>

<!-- FORM -->
<div class="container d-flex justify-content-center align-items-center"
     style="height: 100vh; position: relative; z-index: 1;">

    <div class="card card-auth p-4" style="width: 400px;">

        <h3 class="text-center mb-4 title-auth doimatkhau">Đổi mật khẩu</h3>

        <!-- Alert -->
        <div id="alertBox" class="alert alert-auth d-none"></div>

        <form id="formDoiMK">

            <div class="mb-3">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" class="form-control input-auth" id="currentPassword" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" class="form-control input-auth" id="newPassword" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" class="form-control input-auth" id="confirmPassword" required>
            </div>

            <button type="submit" class="btn btn-auth w-100">
                Đổi mật khẩu
            </button>
        </form>

    </div>
</div>

<!-- SCRIPT -->
<script>
    // Validate form
    document.getElementById("formDoiMK").addEventListener("submit", function(e) {
        e.preventDefault();

        let newPass = document.getElementById("newPassword").value;
        let confirmPass = document.getElementById("confirmPassword").value;
        let alertBox = document.getElementById("alertBox");

        alertBox.classList.remove("d-none", "alert-danger", "alert-success");

        if (newPass !== confirmPass) {
            alertBox.classList.add("alert-danger");
            alertBox.innerText = "Mật khẩu xác nhận không khớp!";
        } else {
            alertBox.classList.add("alert-success");
            alertBox.innerText = "Hợp lệ! (Backend sẽ xử lý)";
        }

        alertBox.classList.remove("d-none");
    });

    // Slideshow background
    const images = [
        "/images/banner1.jpg",
        "/images/banner2.jpg",
        "/images/banner3.jpg",
        "/images/banner4.jpg",
        "/images/banner5.png",
        "/images/banner6.jpg"
    ];

    let index = 0;
    let bg1 = document.getElementById("bg1");
    let bg2 = document.getElementById("bg2");
    let isBg1Active = true;

    setInterval(() => {
        index = (index + 1) % images.length;

        if (isBg1Active) {
            bg2.style.background = `url('${images[index]}') center/cover no-repeat`;
            bg2.style.filter = "blur(6px)";
            bg2.style.opacity = 1;
            bg1.style.opacity = 0;
        } else {
            bg1.style.background = `url('${images[index]}') center/cover no-repeat`;
            bg1.style.filter = "blur(6px)";
            bg1.style.opacity = 1;
            bg2.style.opacity = 0;
        }

        isBg1Active = !isBg1Active;
    }, 2000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
