<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="margin:0; height:100vh; overflow:hidden;">

<!-- BACKGROUND -->
<div id="bg1" style="position: fixed; inset: 0; background: url('static/images/banner1.jpg') center/cover no-repeat; filter: blur(6px); z-index: -2; opacity: 1; transition: 1s;"></div>
<div id="bg2" style="position: fixed; inset: 0; background: url('static/images/banner2.jpg') center/cover no-repeat; filter: blur(6px); z-index: -2; opacity: 0; transition: 1s;"></div>

<!-- overlay -->
<div style="position: fixed; inset: 0; background: rgba(245,230,211,0.6); z-index:-1;"></div>

<!-- CONTAINER -->
<div class="container d-flex justify-content-center align-items-center"
     style="height:100vh; position:relative; z-index:1;">

    <div class="card p-4" style="width:400px; border-radius:15px;">

        <!-- TITLE -->
        <h3 class="text-center mb-4" style="color:#5a3e2b;">Quên mật khẩu</h3>
    <span th:text="${message}"></span>
        <!-- ALERT -->
        <div id="alertBox" class="alert d-none"></div>

        <form  method="post" th:action="@{/user/passwordchange}">

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mật khẩu mới</label>
                <input type="password" id="newPassword" name="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
            </div>


            <button class="btn w-100" style="background:#d8c3a5;" type="submit">Đặt lại mật khẩu</button>
        </form>

<!--            <input type="text" id="otp" class="form-control mb-3 text-center"-->

<!--            <button class="btn w-100" style="background:#d8c3a5;">-->
<!--                Xác nhận OTP-->
<!--            </button>-->

<!--        </form>-->

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
