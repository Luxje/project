<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="margin:0; height:100vh; overflow:hidden;">

<!-- BACKGROUND -->
<div id="bg1" style="position: fixed; inset: 0; background: url('/images/banner1.jpg') center/cover no-repeat; filter: blur(6px); z-index: -2; opacity: 1; transition: 1s;"></div>
<div id="bg2" style="position: fixed; inset: 0; background: url('/images/banner2.jpg') center/cover no-repeat; filter: blur(6px); z-index: -2; opacity: 0; transition: 1s;"></div>

<!-- overlay -->
<div style="position: fixed; inset: 0; background: rgba(245,230,211,0.6); z-index:-1;"></div>

<!-- CONTAINER -->
<div class="container d-flex justify-content-center align-items-center"
     style="height:100vh; position:relative; z-index:1;">

    <div class="card p-4" style="width:400px; border-radius:15px;">

        <!-- TITLE -->
        <h3 class="text-center mb-4" style="color:#5a3e2b;">Quên mật khẩu</h3>

        <!-- ALERT -->
        <div id="alertBox" class="alert d-none"></div>

        <!-- FORM 1 -->
        <form id="formMain">

            <div class="mb-3">
                <label>Gmail</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mật khẩu mới</label>
                <input type="password" id="newPassword" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>

            <button class="btn w-100" style="background:#d8c3a5;">Đặt lại mật khẩu</button>
        </form>

        <!-- FORM OTP -->
        <form id="formOTP" style="display:none;">

            <h5 class="text-center mb-3">Nhập mã OTP</h5>

            <input type="text" id="otp" class="form-control mb-3 text-center"
                   placeholder="Nhập OTP..." style="letter-spacing:5px; font-size:20px;">

            <button class="btn w-100" style="background:#d8c3a5;">
                Xác nhận OTP
            </button>

        </form>

    </div>
</div>

<!-- SCRIPT -->
<script>
    const alertBox = document.getElementById("alertBox");

    // FORM CHÍNH (GỬI OTP)
    document.getElementById("formMain").addEventListener("submit", function(e){
        e.preventDefault();

        let email = document.getElementById("email").value;
        let newPass = document.getElementById("newPassword").value;
        let confirmPass = document.getElementById("confirmPassword").value;

        alertBox.className = "alert";

        if (!email) {
            alertBox.classList.add("alert-danger");
            alertBox.innerText = "Vui lòng nhập Gmail!";
        }
        else if (newPass.length < 6) {
            alertBox.classList.add("alert-danger");
            alertBox.innerText = "Mật khẩu ít nhất 6 ký tự!";
        }
        else if (newPass !== confirmPass) {
            alertBox.classList.add("alert-danger");
            alertBox.innerText = "Mật khẩu không khớp!";
        }
        else {
            //  GỌI BACKEND GỬI OTP
            fetch("/send-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email: email })
            })
                .then(res => res.json())
                .then(data => {
                    alertBox.classList.add("alert-success");
                    alertBox.innerText = data.message || "Đã gửi OTP!";

                    document.getElementById("formMain").style.display = "none";
                    document.getElementById("formOTP").style.display = "block";
                })
                .catch(() => {
                    alertBox.classList.add("alert-danger");
                    alertBox.innerText = "Không gửi được OTP!";
                });
        }

        alertBox.classList.remove("d-none");
    });


    // FORM OTP (VERIFY)
    document.getElementById("formOTP").addEventListener("submit", function(e){
        e.preventDefault();

        let otp = document.getElementById("otp").value;

        alertBox.className = "alert";

        //  GỌI BACKEND VERIFY OTP
        fetch("/verify-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                otp: otp,
                newPassword: document.getElementById("newPassword").value
            })
        })
            .then(res => res.json())
            .then(data => {
                alertBox.classList.add("alert-success");
                alertBox.innerText = data.message || "Đổi mật khẩu thành công!";
            })
            .catch(() => {
                alertBox.classList.add("alert-danger");
                alertBox.innerText = "OTP không hợp lệ hoặc lỗi server!";
            });

        alertBox.classList.remove("d-none");
    });


    // SLIDESHOW (GIỮ NGUYÊN)
    const images = [
        "/images/banner1.jpg",
        "/images/banner2.jpg",
        "/images/banner3.jpg",
        "/images/banner4.jpg",
        "/images/banner5.png",
        "/images/banner6.jpg"
    ];

    let index = 0;
    let bg1 = document.getElementById("bg1");
    let bg2 = document.getElementById("bg2");
    let toggle = true;

    setInterval(()=>{
        index = (index+1)%images.length;

        if(toggle){
            bg2.style.background = `url('${images[index]}') center/cover no-repeat`;
            bg2.style.opacity = 1;
            bg1.style.opacity = 0;
        }else{
            bg1.style.background = `url('${images[index]}') center/cover no-repeat`;
            bg1.style.opacity = 1;
            bg2.style.opacity = 0;
        }

        toggle = !toggle;
    },2000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
